services:
  - type: web
    name: padelparty
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: ""
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "20"
      # Trwała baza: Supabase — tabela public.kv (id text pk, data jsonb).
      # URL nie jest sekretem — zarządzany przez blueprint. Klucz (service_role) w dashboardzie.
      - key: SUPABASE_URL
        value: https://ciqwnobxopioznfzhhgj.supabase.co
      - key: SUPABASE_KEY
        sync: false
      # Opcja B: Upstash Redis (alternatywnie).
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
